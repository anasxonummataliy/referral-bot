services:
  referral-bot:
    build: .
    container_name: referral-bot
    restart: unless-stopped
    ports:
      - "8011:8011"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8011/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
