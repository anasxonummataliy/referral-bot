name: Lint and Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff mypy pylint

    - name: Ruff - Fast Python linter
      run: |
        ruff check app/ api/ tests/ --config pyproject.toml
        ruff format app/ api/ tests/ --check --config pyproject.toml
      continue-on-error: true

    - name: MyPy - Type checking
      run: |
        mypy app/ api/ --config-file=pyproject.toml --ignore-missing-imports
      continue-on-error: true

    - name: Pylint - Extended linting
      run: |
        pylint app/ api/ --exit-zero --max-line-length=120
      continue-on-error: true
